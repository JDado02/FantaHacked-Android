plugins {
    id 'com.android.application'
}

android {
    namespace 'it.fantahacked.app'
    compileSdk 34

    defaultConfig {
        applicationId "it.fantahacked.app"
        // 24 = Android 7. Sotto, la WebView di sistema e' vecchia abbastanza
        // da non capire i moduli JavaScript, che e' come e' scritto il motore.
        minSdk 24
        targetSdk 34
        // Seconda versione: il regolamento si sceglie dall'applicazione, il
        // motore mette davanti chi scende in campo, e c'e' tutto quello che
        // fa il programma per computer - listone, rose degli avversari,
        // undici, piano di spesa, rinomina, turno di chiamata.
        versionCode 2
        versionName "1.1"
    }

    sourceSets {
        main {
            // L'applicazione vive in `web/`, alla radice del progetto: la
            // stessa cartella che si apre nel browser per lavorarci e per
            // farci girare le prove di equivalenza. Gradle la impacchetta
            // da li' invece di tenerne una copia dentro `app/`: due copie
            // sarebbero due versioni, e prima o poi ne aggiorni una sola.
            assets.srcDirs += ['../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Niente offuscamento: dentro non c'e' logica Java da proteggere,
            // e un apk leggibile e' piu' facile da rimettere in piedi fra un
            // anno.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tutte le librerie che passano di qui portano Kotlin, e ne portano
    // versioni diverse: appcompat chiedeva stdlib-jdk7/jdk8 1.6.21 e webkit
    // stdlib 1.8.22, che dalla 1.8 contiene gia' quei due - e il compilatore
    // si fermava su duecento classi duplicate. Questa riga le allinea tutte
    // a una versione sola. Non e' una dipendenza in piu': e' un accordo su
    // quale versione usare.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Serve a servire gli assets su un indirizzo https finto: senza, la
    // pagina non ha un'origine e non puo' scaricare niente.
    implementation 'androidx.webkit:webkit:1.11.0'
}
