<!doctype html>
<meta charset="utf-8">
<title>FantaHacked — le regole dell'asta, sul telefono</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
         background: #101216; color: #e6e8ec; margin: 0; padding: 18px 22px; }
  h1 { font-size: 15px; color: #9aa3b2; font-weight: 600; margin: 0 0 14px; }
  .ok { color: #63d38a; } .no { color: #ff6b6b; } .tit { color: #f0b429; margin-top: 12px; }
  pre { white-space: pre-wrap; margin: 0; }
</style>
<h1>Quello che non deve poter succedere</h1>
<pre id="esito">avvio…</pre>

<script type="module">
// Le prove di equivalenza dicono che i due motori calcolano uguale. Queste
// dicono un'altra cosa: che l'asta, sul telefono, si comporta come deve.
// Sono le regole che se saltano non si vede un numero sbagliato - si perde
// una serata: crediti che non tornano dopo un annullo, un giocatore comprato
// due volte, un'asta che non si ritrova al riavvio.
const q = '?v=' + Date.now();
const { carica: caricaRegole } = await import('../web/motore/regole.js' + q);
const { da: datiDa } = await import('../web/motore/dati.js' + q);
const { StatoAsta, DepositoLocale, ErroreAsta } = await import('../web/motore/asta.js' + q);
const { Valutatore } = await import('../web/motore/valutazione.js' + q);
const { Ottimizzatore } = await import('../web/motore/ottimizzatore.js' + q);
const { Consigliere } = await import('../web/motore/strategia.js' + q);
const { Equilibrio } = await import('../web/motore/equilibrio.js' + q);
const { arrotonda } = await import('../web/motore/comune.js' + q);

const out = document.getElementById('esito');
const righe = [];
let superati = 0;
let falliti = 0;

function scrivi(t, c) {
  righe.push(c ? `<span class="${c}">${t}</span>` : t);
  out.innerHTML = righe.join('\n');
}
function titolo(t) { scrivi('\n' + t, 'tit'); }
function verifica(nome, cond, dettaglio) {
  if (cond) { superati += 1; scrivi('  OK   ' + nome, 'ok'); }
  else { falliti += 1; scrivi('  NO   ' + nome + '   ' + (dettaglio || ''), 'no'); }
}

const NOMI = ['Davide', 'Luca', 'Windser', 'Jacopo', 'Giorgio', 'Viane', 'Fede', 'Canzia'];

async function main() {
  const grezzi = await (await fetch('dati/dati.json')).json();
  const regoleJson = grezzi.regole
    || await (await fetch('dati/regole_lega.json')).json();
  const reg = caricaRegole(regoleJson);
  const dati = datiDa(grezzi);
  const perId = new Map(dati.giocatori.map((g) => [g.id, g]));

  const chiave = 'fantahacked.prova.' + Date.now();
  const deposito = new DepositoLocale(chiave);

  function apri() {
    const st = new StatoAsta(reg, deposito);
    st.collega(perId);
    const salvata = deposito.leggi();
    if (salvata) st.carica(salvata);
    return st;
  }

  titolo('[1] Le regole arrivano col pacchetto');
  verifica('il pacchetto porta le regole della lega', !!grezzi.regole);
  verifica('e sono quelle giuste', reg.partecipanti === 8 && reg.crediti === 500,
           reg.partecipanti + ' squadre, ' + reg.crediti + ' crediti');
  verifica('la firma del regolamento e\' nel manifest dei dati',
           !!(dati.meta && dati.meta.regole_firma), JSON.stringify(dati.meta));

  titolo('[2] L\'asta si ritrova al riavvio');
  let st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  let v = new Valutatore(dati, reg, st);
  let o = new Ottimizzatore(v);
  const malen = [...v.g.values()].find((x) => x.nome === 'Malen');
  st.registra(malen.id, 1, 184, 205);
  const st2 = apri();               // come se l'applicazione fosse stata chiusa
  verifica('l\'acquisto c\'e\' ancora dopo la riapertura',
           st2.acquisti().length === 1 && st2.acquisti()[0].prezzo === 184);
  verifica('col limite di allora', st2.acquisti()[0].limite === 205);
  verifica('e i crediti sono scesi', st2.io().crediti === 500 - 184);
  verifica('i nomi delle squadre sono i miei',
           st2.presidenti().map((p) => p.nome).join(',') === NOMI.join(','));

  titolo('[3] Annullare rimette tutto com\'era');
  st2.annulla(malen.id);
  verifica('i crediti tornano interi', st2.io().crediti === 500);
  verifica('il giocatore torna libero', !st2.venduti().has(malen.id));
  const st3 = apri();
  verifica('e anche riaprendo', st3.acquisti().length === 0);

  titolo('[4] Quello che non si puo\' fare');
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  st.registra(malen.id, 1, 10, null);
  let errore = null;
  try { st.registra(malen.id, 2, 10, null); } catch (e) { errore = e; }
  verifica('lo stesso giocatore non si compra due volte',
           errore instanceof ErroreAsta, String(errore));
  errore = null;
  try { st.registra(malen.id + 999999, 1, 10, null); } catch (e) { errore = e; }
  verifica('un giocatore inesistente viene rifiutato', errore instanceof ErroreAsta);
  errore = null;
  const altro = [...v.g.values()].find((x) => x.ruolo === 'A' && x.id !== malen.id);
  try { st.registra(altro.id, 1, 0, null); } catch (e) { errore = e; }
  verifica('il prezzo minimo e\' 1', errore instanceof ErroreAsta);
  errore = null;
  try { st.registra(altro.id, 1, 500, null); } catch (e) { errore = e; }
  verifica('non si puo\' spendere tutto e restare senza rosa',
           errore instanceof ErroreAsta, String(errore));
  verifica('dopo un rifiuto lo stato non e\' cambiato',
           st.acquisti().length === 1 && st.io().crediti === 490);

  titolo('[5] Chi non e\' in lista non si compra, nemmeno per un credito');
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st);
  o = new Ottimizzatore(v);
  let c = new Consigliere(v, o);
  const fuori = [...v.g.values()].filter((x) => x.fuori_lista);
  verifica('ce ne sono, e sono parecchi', fuori.length > 10, fuori.length + ' trovati');
  const uno = fuori.find((x) => x.ruolo === 'A') || fuori[0];
  verifica('il limite e\' zero', o.maxBid(uno)[0] === 0, uno.nome);
  verifica('il verdetto lo dice', c.decisione(uno).verdetto === 'FUORI LISTA');
  verifica('le presenze attese sono zero', (uno.presenze || 0) === 0);
  // E anche a fine asta, quando la regola degli ultimi posti ripescherebbe
  // chiunque pur di non lasciare una casella vuota. Il caso va costruito
  // davvero: un solo slot scoperto e i crediti finiti. Ventitre' giocatori a
  // un credito, uno a quattrocentosettantasei, e resta un attaccante da
  // trovare con un credito in mano - meno del costo di un riempitivo.
  const sano = (r) => v.disponibili(r).filter((x) => !x.fuori_lista);
  for (const r of ['P', 'D', 'C']) {
    for (const x of sano(r).slice(0, reg.slot[r])) st.registra(x.id, 1, 1, null);
  }
  const att = sano('A');
  for (const x of att.slice(0, reg.slot.A - 2)) st.registra(x.id, 1, 1, null);
  st.registra(att[reg.slot.A - 2].id, 1, st.io().crediti - 1, null);
  verifica('la rosa e\' piena tranne un posto', st.slotResidui(1) === 1,
           st.slotResidui(1) + ' slot');
  verifica('e i crediti sono finiti', st.io().crediti === 1, '' + st.io().crediti);
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const uno2 = v.g.get(uno.id);
  verifica('la regola degli ultimi posti e\' attiva',
           o.ultimiPosti('A') === true);
  verifica('su chi e\' in lista ripesca davvero',
           o.maxBid(v.disponibili('A').find((x) => !x.fuori_lista))[0] === 1);
  verifica('ma su di lui il limite resta zero', o.maxBid(uno2)[0] === 0,
           'limite ' + o.maxBid(uno2)[0]);
  verifica('e il verdetto non cambia', c.decisione(uno2).verdetto === 'FUORI LISTA');

  titolo('[6] I portieri a pacchetto');
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st);
  verifica('la lega li usa', v.pacchetto === true);
  const titolare = v.disponibili('P').find((x) => x.titolare_por && v.riserveDi(x.id).length >= 2);
  verifica('un titolare si porta dietro le riserve', !!titolare,
           titolare ? titolare.nome : 'nessuno trovato');
  if (titolare) {
    st.registra(titolare.id, 1, 40, null);
    for (const rid of v.riserveDi(titolare.id)) {
      if (st.slotResidui(1, 'P') <= 0) break;
      st.registra(rid, 1, 1, null);
    }
    verifica('il reparto portieri si chiude con una chiamata sola',
             st.slotResidui(1, 'P') === 0, st.slotResidui(1, 'P') + ' slot rimasti');
    verifica('e costa il titolare piu\' due crediti',
             st.io().crediti === 500 - 42, '' + st.io().crediti);
    const vv = new Valutatore(dati, reg, st);
    const oo = new Ottimizzatore(vv);
    const altroP = vv.disponibili('P')[0];
    verifica('da li\' in poi nessun portiere ha piu\' un limite',
             oo.maxBid(altroP)[0] === 0, altroP.nome);
  }

  titolo('[7] Il motore risponde in fretta');
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  const t0 = performance.now();
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const t1 = performance.now();
  const cons = c.consiglio();
  const t2 = performance.now();
  const x0 = v.disponibili('A')[0];
  const t3 = performance.now();
  o.maxBid(x0);
  const t4 = performance.now();
  scrivi('       costruire il motore ' + Math.round(t1 - t0) + ' ms, '
       + 'un consiglio ' + Math.round(t2 - t1) + ' ms, '
       + 'un limite ' + Math.round(t4 - t3) + ' ms');
  verifica('un consiglio completo sta sotto il mezzo secondo', (t2 - t1) < 500);
  verifica('un limite sta sotto i cento millisecondi', (t4 - t3) < 100);
  verifica('e il consiglio ha davvero qualcosa da dire',
           !!cons.indicazione && (cons.top.length + cons.alternative.length) > 0);


  titolo('[8] Il regolamento scelto cambia davvero i prezzi');
  // E' la domanda dell'utente: «i prezzi e la strategia cambiano se cambio il
  // numero di persone?». Devono, e in una direzione precisa. Il livello di
  // rimpiazzo e' la fantamedia del giocatore che resta a chi arriva ultimo:
  // con venti squadre la lega assorbe piu' giocatori, quindi quel livello
  // scende, e chi sta in cima vale **di piu'** rispetto a lui. Il limite
  // massimo pero' scende lo stesso, perche' i crediti in tasca sono sempre
  // quelli e comprano una fetta piu' piccola di un mercato piu' affollato.
  function conRegole(modifiche) {
    const r = caricaRegole(regoleJson, modifiche);
    const s = new StatoAsta(r, null);
    s.collega(perId);
    s.inizializza(NOMI.slice(1, r.partecipanti), NOMI[0]);
    const vv = new Valutatore(dati, r, s);
    return { reg: r, stato: s, v: vv, o: new Ottimizzatore(vv) };
  }
  const pochi = conRegole({ partecipanti: 6 });
  const tanti = conRegole({ partecipanti: 20 });
  verifica('con piu\' squadre il livello di rimpiazzo scende',
           tanti.v.rimpiazzo_fm.P < pochi.v.rimpiazzo_fm.P,
           pochi.v.rimpiazzo_fm.P.toFixed(3) + ' con 6, '
           + tanti.v.rimpiazzo_fm.P.toFixed(3) + ' con 20');
  const nomeTop = pochi.v.disponibili('P')[0].nome;
  const vorPochi = pochi.v.g.get(pochi.v.disponibili('P')[0].id).vor;
  const xTanti = [...tanti.v.g.values()].find((x) => x.nome === nomeTop);
  verifica('e chi sta in cima vale di piu\' sopra il rimpiazzo',
           xTanti.vor > vorPochi,
           nomeTop + ': ' + vorPochi.toFixed(1) + ' con 6, '
           + xTanti.vor.toFixed(1) + ' con 20');
  // E sale anche il limite, che e' la stessa cosa detta in crediti: `maxBid`
  // non e' un prezzo, e' quanto quel giocatore vale **per la mia rosa**, e in
  // una lega grande l'alternativa che avrei al suo posto e' molto peggiore.
  verifica('e quindi sale anche il tuo limite su di lui',
           tanti.o.maxBid(xTanti)[0] > pochi.o.maxBid(pochi.v.disponibili('P')[0])[0],
           pochi.o.maxBid(pochi.v.disponibili('P')[0])[0] + ' con 6, '
           + tanti.o.maxBid(xTanti)[0] + ' con 20');
  const ricchi = conRegole({ crediti_iniziali: 1000 });
  const poveri = conRegole({ crediti_iniziali: 250 });
  const nomeA = poveri.v.disponibili('A')[0].nome;
  const aRicchi = [...ricchi.v.g.values()].find((x) => x.nome === nomeA);
  const aPoveri = [...poveri.v.g.values()].find((x) => x.nome === nomeA);
  verifica('col doppio dei crediti tutto costa circa il doppio',
           aRicchi.prezzo_mercato > 3 * aPoveri.prezzo_mercato,
           nomeA + ': ' + Math.round(aPoveri.prezzo_mercato) + ' a 250 crediti, '
           + Math.round(aRicchi.prezzo_mercato) + ' a 1000');
  const senzaMod = conRegole({ modificatore_difesa: false });
  const conMod = conRegole({ modificatore_difesa: true });
  const difOk = conMod.v.disponibili('D')[0];
  verifica('col modificatore acceso i difensori valgono di piu\'',
           difOk.punti_mod > 0
           && [...senzaMod.v.g.values()].find((x) => x.id === difOk.id).punti_mod === 0,
           difOk.nome + ': +' + difOk.punti_mod.toFixed(1) + ' punti di modificatore');
  const senzaPacco = conRegole({ portieri_a_pacchetto: false });
  verifica('coi portieri uno per uno il pacchetto si spegne',
           senzaPacco.v.pacchetto === false
           && senzaPacco.o.maxBid(senzaPacco.v.disponibili('P')[1])[0] > 0,
           'il secondo portiere ha un limite suo');

  titolo('[9] Il regolamento viaggia con l\'asta');
  // Un'asta si gioca fino in fondo con le regole con cui e' cominciata.
  // Cambiare i crediti a meta' serata e vedersi ricalcolare all'indietro i
  // limiti gia' spesi non sarebbe una comodita', sarebbe un modo di perderla.
  const depR = new DepositoLocale(chiave + '.regole');
  const regSei = caricaRegole(regoleJson, { partecipanti: 6, crediti_iniziali: 333 });
  const stR = new StatoAsta(regSei, depR);
  stR.collega(perId);
  stR.inizializza(NOMI.slice(1, 6), NOMI[0]);
  verifica('le regole sono scritte dentro l\'asta', !!stR.regoleSalvate());
  const riletto = caricaRegole(stR.regoleSalvate(), null);
  verifica('e rileggendole si ritrovano identiche',
           riletto.partecipanti === 6 && riletto.crediti === 333,
           riletto.partecipanti + ' squadre, ' + riletto.crediti + ' crediti');
  verifica('i presidenti sono davvero sei', stR.presidenti().length === 6);
  depR.cancella();

  titolo('[10] Prima chi gioca, poi chi conviene');
  // La rosa ha otto difensori, ma in campo ne vanno quattro ogni domenica.
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const copVuota = c.copertura('D');
  verifica('a difesa vuota non copri niente',
           copVuota.coperti === 0 && copVuota.mancano === 4 && copVuota.servono === 4,
           JSON.stringify(copVuota));
  // Quattro titolari veri: la copertura deve arrivare quasi a quattro.
  const titolari = v.disponibili('D').filter((x) => Consigliere.giocaSempre(x)).slice(0, 4);
  verifica('di titolari fissi ce n\'e\' abbastanza', titolari.length === 4);
  for (const x of titolari) st.registra(x.id, 1, 1, null);
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const copPiena = c.copertura('D');
  // Nemmeno quattro titolari veri coprono quattro caselle, ed e' il punto di
  // tutto il conto: quattro giocatori da trenta presenze riempiono poco piu'
  // di tre caselle su quattro, perche' dietro non c'e' nessuno. Per arrivare
  // a quattro serve il quinto.
  verifica('quattro titolari coprono piu\' di tre caselle su quattro',
           copPiena.coperti > 3.0 && copPiena.coperti < 4.0,
           copPiena.coperti + ' su 4');
  verifica('e il programma li conta come titolari fissi', copPiena.titolari === 4);
  const quinto = v.disponibili('D').find(
    (x) => Consigliere.giocaSempre(x) && !st.venduti().has(x.id));
  st.registra(quinto.id, 1, 1, null);
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const copCinque = c.copertura('D');
  verifica('col quinto la difesa si chiude davvero',
           copCinque.coperti > copPiena.coperti && copCinque.mancano < 0.5,
           copPiena.coperti + ' con quattro, ' + copCinque.coperti + ' con cinque');
  // Lo stesso reparto, ma fatto di gente che gioca mezzo campionato.
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st);
  const mezzi = v.disponibili('D').filter(
    (x) => (x.presenze || 0) > 12 && (x.presenze || 0) < 20).slice(0, 4);
  for (const x of mezzi) st.registra(x.id, 1, 1, null);
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const copMezza = c.copertura('D');
  verifica('quattro da mezzo campionato non coprono quattro caselle',
           copMezza.coperti < copPiena.coperti - 0.8,
           copMezza.coperti + ' su 4, contro ' + copPiena.coperti);
  // Perche' il programma parli di difensori bisogna che la fase **sia** quella
  // dei difensori: finche' restano portieri da assegnare parla di portieri, e
  // fa bene. Quindi si finisce il reparto prima, come succede a un'asta vera.
  for (const p of st.presidenti()) {
    let scudo = 0;
    while (st.slotResidui(p.id, 'P') > 0 && scudo < 10) {
      scudo += 1;
      const por = v.disponibili('P').find((x) => x.titolare_por);
      if (!por) break;
      st.registra(por.id, p.id, 1, null);
      for (const rid of v.riserveDi(por.id)) {
        if (st.slotResidui(p.id, 'P') <= 0) break;
        st.registra(rid, p.id, 1, null);
      }
      v = new Valutatore(dati, reg, st);
    }
  }
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  verifica('adesso si chiamano i difensori', c.fase() === 'D', c.fase());
  verifica('e il programma lo dice nella prima riga',
           c.consiglio(12).indicazione.startsWith('In campo vanno 4 difensori'),
           c.consiglio(12).indicazione.slice(0, 60));
  const consD = c.consiglio(12);
  const primiTre = consD.top.slice(0, 3);
  verifica('coi titolari da coprire, la lista non apre con un giocatore da panchina',
           primiTre.length === 0 || primiTre.some((d) => d.titolare_pieno),
           primiTre.map((d) => d.nome + (d.titolare_pieno ? '' : ' (panchina)')).join(', '));
  verifica('nessuno che gioca meno di quindici giornate sta in cima',
           !consD.top.length || (consD.top[0].presenze / 38) >= 0.40,
           consD.top.length ? consD.top[0].nome + ', ' + consD.top[0].presenze
                              + ' presenze' : 'lista vuota');

  titolo('[11] Il reparto chiuso non lascia mai la pagina bianca');
  // Coi portieri a pacchetto la mia scelta e' una sola, e poi restano sette
  // pacchetti da assegnare agli altri: sette chiamate in cui non posso fare
  // niente. Prima, arrivati all'ultimo, la pagina restava vuota.
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st);
  const mioP = v.disponibili('P').find((x) => x.titolare_por);
  st.registra(mioP.id, 1, 30, null);
  for (const rid of v.riserveDi(mioP.id)) {
    if (st.slotResidui(1, 'P') <= 0) break;
    st.registra(rid, 1, 1, null);
  }
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
  const chiuso = c.consiglio(12);
  verifica('la fase e\' ancora quella dei portieri', chiuso.fase === 'P');
  verifica('ma quello che si vede e\' il reparto dopo', chiuso.anticipo === 'D',
           'anticipo: ' + chiuso.anticipo);
  verifica('e la lista non e\' vuota', chiuso.top.length > 0,
           chiuso.top.length + ' consigliati');
  verifica('la frase spiega perche\'',
           chiuso.indicazione.startsWith('Hai chiuso i portieri'),
           chiuso.indicazione.slice(0, 70));
  verifica('non si propone di far pagare un portiere che non posso rilanciare',
           chiuso.svuotare.length === 0);
  verifica('e lo dice, invece di lasciare la sezione muta',
           (chiuso.vuoti.svuotare || '').includes('un altro reparto'),
           chiuso.vuoti.svuotare);
  // Fino all'ultimo pacchetto: nemmeno con un solo avversario in gara.
  let giri = 0;
  while (st.slotResiduiRuolo('P') > 0 && giri < 40) {
    giri += 1;
    v = new Valutatore(dati, reg, st);
    const chi = st.presidenti().find((p) => st.slotResidui(p.id, 'P') > 0);
    if (!chi) break;
    const x = v.disponibili('P').find((y) => y.titolare_por);
    if (!x) break;
    st.registra(x.id, chi.id, 1, null);
    for (const rid of v.riserveDi(x.id)) {
      if (st.slotResidui(chi.id, 'P') <= 0) break;
      st.registra(rid, chi.id, 1, null);
    }
    v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v); c = new Consigliere(v, o);
    const d = c.consiglio(12);
    if (st.slotResiduiRuolo('P') > 0 && d.top.length === 0) {
      verifica('la pagina resta piena anche all\'ultimo pacchetto', false,
               st.slotResiduiRuolo('P') + ' caselle rimaste e nessun consiglio');
      break;
    }
  }
  verifica('la pagina resta piena fino all\'ultimo pacchetto',
           st.slotResiduiRuolo('P') === 0, st.slotResiduiRuolo('P') + ' rimaste');

  titolo('[12] Rinominare non tocca le rose');
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st);
  const qualcuno = v.disponibili('C')[0];
  st.registra(qualcuno.id, 2, 25, null);
  const prima = { crediti: st.presidenti()[1].crediti, acquisti: st.acquisti().length };
  st.rinomina(['Io', 'Jacopo', 'Windser', 'Luca', 'Viane', 'Giorgio', 'Fede', 'Canzia']);
  verifica('i nomi cambiano',
           st.presidenti().map((p) => p.nome).join(',')
           === 'Io,Jacopo,Windser,Luca,Viane,Giorgio,Fede,Canzia');
  verifica('gli acquisti restano dove sono', st.acquisti().length === prima.acquisti);
  verifica('e i crediti pure',
           st.presidenti().find((p) => p.nome === 'Jacopo').crediti === prima.crediti);
  let errR = null;
  try { st.rinomina(['uno', 'due']); } catch (e) { errR = e; }
  verifica('un elenco di nomi incompleto viene rifiutato', errR instanceof ErroreAsta);
  st.rinomina(['Io', 'Mario', 'Mario', 'Mario', 'e', 'f', 'g', 'h']);
  verifica('due squadre non possono chiamarsi uguale',
           new Set(st.presidenti().map((p) => p.nome)).size === 8,
           st.presidenti().map((p) => p.nome).join(','));

  titolo('[13] L\'undici, e il rischio di restare in dieci');
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v);
  let eq = new Equilibrio(v, o);
  const vuoto = eq.quadro();
  verifica('a rosa vuota l\'undici e\' tutto da riempire',
           vuoto.undici.caselle_vuote === 11 && vuoto.in_rosa === 0,
           vuoto.undici.caselle_vuote + ' caselle vuote');
  verifica('e il modulo scelto e\' uno di quelli ammessi',
           ['343', '352', '442', '433', '451', '532', '541']
             .includes(vuoto.undici.modulo), vuoto.undici.modulo);
  // Una rosa di gente che non gioca: in rosa ci sono, in campo no.
  const scarsi = (r, n) => v.disponibili(r)
    .filter((x) => (x.presenze || 0) > 0 && (x.presenze || 0) < 12).slice(0, n);
  for (const r of ['P', 'D', 'C', 'A']) {
    for (const x of scarsi(r, reg.slot[r])) {
      try { st.registra(x.id, 1, 1, null); } catch (e) { /* crediti */ }
    }
  }
  v = new Valutatore(dati, reg, st); o = new Ottimizzatore(v);
  eq = new Equilibrio(v, o);
  const fragile = eq.quadro();
  verifica('una rosa di gente che non gioca fa alzare il rischio',
           fragile.rischio.quota > 0.2,
           Math.round(100 * fragile.rischio.quota) + '% delle giornate');
  verifica('e il programma avvisa, dicendo anche quale reparto',
           fragile.avvisi.some((a) => a.tipo === 'rischio'),
           fragile.avvisi.map((a) => a.tipo).join(','));

  titolo("[14] A meta' strada si arrotonda come Python");
  // Le cinquecento aste per parte sono venute identiche in tutto tranne il
  // punteggio schierato, e la colpa era di due giocatori con **esattamente**
  // 30,5 e 28,5 presenze attese: `round(30.5)` in Python fa 30, `Math.round`
  // in JavaScript fa 31. Non e' un caso di scuola - le presenze nascono da
  // `titolarita * 38`, e sul mezzo punto ci cadono spesso.
  verifica('arrotonda(30.5) fa 30, non 31', arrotonda(30.5) === 30,
           'e invece ' + arrotonda(30.5));
  verifica('arrotonda(28.5) fa 28', arrotonda(28.5) === 28);
  verifica('arrotonda(29.5) fa 30', arrotonda(29.5) === 30);
  verifica('sui numeri normali si comporta come sempre',
           arrotonda(30.4) === 30 && arrotonda(30.6) === 31);
  // E i giocatori col mezzo punto ci sono davvero, in questo listone.
  st = apri();
  st.inizializza(NOMI.slice(1), NOMI[0]);
  v = new Valutatore(dati, reg, st);
  const mezzoPunto = [...v.g.values()].filter(
    (x) => Math.abs((x.presenze || 0) - Math.floor(x.presenze || 0) - 0.5) < 1e-9);
  verifica('e nel listone ce ne sono', mezzoPunto.length > 0,
           mezzoPunto.length + ' giocatori, per esempio '
           + mezzoPunto.slice(0, 3).map((x) => x.nome + ' ' + x.presenze).join(', '));
  c = new Consigliere(v, new Ottimizzatore(v));
  if (mezzoPunto.length) {
    verifica('e il motore li conta col numero giusto',
             c.decisione(mezzoPunto[0]).presenze === arrotonda(mezzoPunto[0].presenze),
             mezzoPunto[0].nome + ': ' + c.decisione(mezzoPunto[0]).presenze);
  }

  deposito.cancella();
  scrivi('');
  scrivi(`${falliti ? 'CI SONO ERRORI' : 'TUTTO OK'}   ${superati} superati, ${falliti} falliti`,
         falliti ? 'no' : 'ok');
  window.__esito = { superati, falliti };
}

main().catch((e) => {
  scrivi('ERRORE: ' + (e && e.stack ? e.stack : e), 'no');
  window.__esito = { errore: String(e) };
});
</script>
