<!doctype html>
<meta charset="utf-8">
<title>FantaHacked — il caso, uguale nelle due lingue</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
         background: #090D12; color: #EAF0F6; margin: 0; padding: 18px 22px; }
  h1 { font-size: 15px; color: #A6B7C7; font-weight: 600; margin: 0 0 14px; }
  .ok { color: #46D093; } .no { color: #FF6069; } .tit { color: #F5B63F; }
  pre { white-space: pre-wrap; margin: 0; }
</style>
<h1>Lo stesso caso, nelle due lingue</h1>
<pre id="esito">avvio…</pre>

<script type="module">
// Perche' questa pagina esiste: due simulazioni che giocano "duecento aste"
// con due generatori casuali diversi producono due campioni diversi, e
// confrontarne i risultati non dice niente sul motore. Con lo stesso
// generatore, invece, l'asta e' **la stessa partita**: stesso ordine di
// chiamata, stessi avversari, stessi rilanci. Allora un numero diverso in
// fondo e' un difetto, non sfortuna.
const { Casuale } = await import('./casuale.js?v=' + Date.now());

const out = document.getElementById('esito');
const righe = [];
let ok = 0, no = 0;
const scrivi = (t, c) => { righe.push(c ? `<span class="${c}">${t}</span>` : t);
                           out.innerHTML = righe.join('\n'); };

function confronta(nome, attesi, avuti, esatto) {
  let diverse = 0;
  for (let i = 0; i < attesi.length; i += 1) {
    const a = attesi[i], b = avuti[i];
    const uguale = esatto ? a === b
      : Math.abs(a - b) <= 1e-12 * Math.max(1, Math.abs(a));
    if (!uguale) { diverse += 1; if (diverse === 1) scrivi(`       [${i}] atteso ${a}  avuto ${b}`, 'no'); }
  }
  if (diverse) { no += 1; scrivi('  NO   ' + nome + '   ' + diverse + ' su ' + attesi.length, 'no'); }
  else { ok += 1; scrivi('  OK   ' + nome + '   ' + attesi.length + ' valori', 'ok'); }
}

const attesi = await (await fetch('attesi_casuale.json')).json();
for (const seme of Object.keys(attesi)) {
  scrivi('\nseme ' + seme, 'tit');
  const a = attesi[seme];
  const r = new Casuale(parseInt(seme, 10));
  confronta('random()', a.random, Array.from({length: 6}, () => r.random()));
  confronta('getrandbits()', a.getrandbits, [1, 3, 8, 17, 32].map((k) => r.getrandbits(k)), true);
  const venti = Array.from({length: 23}, (_, i) => i);
  confronta('choice()', a.choice, Array.from({length: 6}, () => r.choice(venti)), true);
  confronta('uniform()', a.uniform, Array.from({length: 4}, () => r.uniform(1.4, 2.0)));
  confronta('normalvariate()', a.normal, Array.from({length: 4}, () => r.normalvariate(0, 1)));
  confronta('lognormvariate()', a.lognorm,
            Array.from({length: 4}, () => r.lognormvariate(Math.log(1.22), 0.32)));
  confronta('gammavariate()', a.gamma,
            [1.82, 3.12, 5.46, 15.6, 0.5, 1.0].map((al) => r.gammavariate(al, 1.0)));
}

scrivi('');
scrivi(`${no ? 'CI SONO DIFFERENZE' : 'IDENTICO'}   ${ok} prove uguali, ${no} diverse`,
       no ? 'no' : 'ok');
window.__esito = { ok, no };
</script>
